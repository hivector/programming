<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Variable</title>
</head>
<body>
   <p id="demo">This is a paragraph.</p>

<button onclick="myFunction()">Click me</button><br><br>  
<a href="https://www.w3schools.com/js/js_output.asp">Learn more</a>

<script>
function myFunction() {
  document.getElementById("demo").innerHTML = "Paragraph changed."; 
  
  // document.getElementById("demo").innerHTML is used to change the content of the paragraph with id "demo" to "Paragraph changed."
}
</script>
</body>
</html>
